<!DOCTYPE html>
<html lang="en">
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bioadata</title>
    <title>Form Biodata Siswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

    <div class="form-container">
        <h2>BIODATA SISWA</h2>
        <p class="form-instruction">Silakan isi seluruh formulir di bawah ini dengan benar. Semua kolom wajib terisi sebelum tombol simpan dapat ditekan.</p>
        
        <form id="biodataForm" onsubmit="disimpandulu(event)">
            
            <div class="form-group">
                <label>NISN:</label>
                <input type="number" id="nisn" oninput="batasinisn(this)" placeholder="Isikan NISN" required>
            </div>

            <div class="form-group">
                <label>Nama:</label>
                <input type="text" id="nm" placeholder="Isikan nama lengkap" required>
            </div>

            <div class="form-group">
                <label>Tempat Lahir:</label>
                <input type="text" id="tl" placeholder="Isikan Kota kelahiran" required>
            </div>

            <div class="form-group">
                <label>Tanggal Lahir:</label>
                <input type="date" id="tr" required>
            </div>

            <div class="form-group">
                <label>Jenis Kelamin:</label>
                <div class="radio-group">
                    <label><input type="radio" name="jk" value="Laki-laki" required> Laki-laki</label>
                    <label><input type="radio" name="jk" value="Perempuan"> Perempuan</label>
                    <label><input type="radio" name="jk" value="Boti"> Boti</label>
                </div>
            </div>

            <div class="form-group">
                <label>Berat Badan (kg):</label>
                <input type="number" id="bb" placeholder="Contoh: 66.23" step="0.01" oninput="batasidesimal(this)" required>
            </div>

            <div class="form-group">
                <label>Tinggi Badan (cm):</label>
                <input type="number" id="tb" placeholder="Contoh: 173.75" step="0.01" oninput="batasidesimal(this)" required>
            </div>

            <div class="form-group">
                <label>Agama:</label>
                <select id="agm" required>
                    <option value="">-- Pilih Agama --</option>
                    <option value="Islam">Islam</option>
                    <option value="Kristen">Kristen</option>
                    <option value="Katolik">Katolik</option>
                    <option value="Hindu">Hindu</option>
                    <option value="Buddha">Buddha</option>
                    <option value="Konghucu">Konghucu</option>
                    <option value="Kepercayaan">Kepercayaan</option>
                </select>
            </div>

            <div class="form-group">
                <label>Jurusan:</label>
                <select id="jrsn" required>
                    <option value="">-- Pilih Jurusan --</option>
                    <option value="PPLG">PPLG</option>
                    <option value="TJKT">TJKT</option>
                    <option value="TSM">TSM</option>
                    <option value="TO">TO</option>
                    <option value="TEI">TEI</option>
                </select>
            </div>

            <div class="form-group">
                <label>No. HP:</label>
                <input type="text" id="no" oninput="batasino(this)" maxlength="13" placeholder="08xxxxxxxxxx" required>
            </div>

            <div class="form-group">
                <label>Alamat:</label>
                <textarea id="almt" rows="3" placeholder="Isikan alamat lengkap" required></textarea>
            </div>

            <div class="form-group">
                <label>Hobi:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="hb" value="Coding"> Coding</label>
                    <label><input type="checkbox" name="hb" value="Olahraga"> Olahraga</label>
                    <label><input type="checkbox" name="hb" value="Musik"> Musik</label>
                    <label><input type="checkbox" name="hb" value="Scroll TikTok"> Scroll TikTok</label>                    
                    <label><input type="checkbox" name="hb" value="Rebahan"> Rebahan</label>
                </div>
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="eml" placeholder="email@domain.com" required>
            </div>

            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="pw" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label>Foto:</label>
                <input type="file" id="foto" accept="image/*" required>
            </div>

            <button type="submit" class="btn-submit">Simpan</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
